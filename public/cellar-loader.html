<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CELLAR Loader</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap">
<style>
/* Layout: one centered column on a deep cryo-navy field — emblem, wordmark, tagline, progress */
:root {
  --ground-1: #22406a;
  --ground-2: #142a47;
  --ground-3: #0d1c31;
  --frost: #eef7ff;
  --ice: #b4daf6;
  --ice-deep: #6aa8de;
  --muted: #7fa7cc;
  --track: rgba(169, 212, 245, .14);
  --font-brand: "Montserrat", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 38%, var(--ground-1) 0%, var(--ground-2) 55%, var(--ground-3) 100%) var(--ground-2);
  color: var(--frost);
  font-family: var(--font-brand);
  overflow: hidden;
}
canvas#frost { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.stage {
  position: relative;
  height: 100%;
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
}
svg.emblem { width: min(66vw, 360px, 47vh); height: auto; overflow: visible; max-width: 100%; }

/* resting state = finished logo; .play adds the formation sequence */
.reveal { stroke-dasharray: 1; stroke-dashoffset: 0; }
.fb { transform-box: fill-box; transform-origin: 50% 50%; }
.hang { transform-box: fill-box; transform-origin: 50% 0%; }

.play .m-ring  { animation: draw 1.7s cubic-bezier(.65,0,.35,1) .3s both; }
.play .m-c     { animation: draw .9s cubic-bezier(.5,0,.3,1) 1.25s both; }
.play .m-neck  { animation: fade .5s ease 1.75s both; }
.play .m-band  { animation: draw 1.15s cubic-bezier(.5,0,.25,1) 1.85s both; }
.play .m-bandB { animation: draw .7s cubic-bezier(.5,0,.25,1) 1.85s both; }
.play .sphere  { animation: sphereIn 1s cubic-bezier(.2,1.35,.4,1) 2.2s both, breathe 4s ease-in-out 3.4s infinite; }
.play .halo    { animation: haloIn 1.4s ease-out 2.2s both, haloPulse 4s ease-in-out 3.6s infinite; }
.play .m-cc    { animation: draw .75s cubic-bezier(.6,0,.3,1) 2.85s both; }
.play .mist    { animation: mistIn 1.6s ease-out both, drift 7s ease-in-out infinite alternate; }
.play .icicle  { animation: icicle .55s cubic-bezier(.3,1.5,.5,1) both; }
.play .drop    { animation: drop .8s cubic-bezier(.4,0,.2,1) both, bob 4s ease-in-out infinite alternate; }
.play .glint   { animation: glintIn .5s ease 3.9s both, glint 6s linear 3.9s infinite; }

.glint { stroke-dasharray: .07 .93; }

@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes mistIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes drift { from { transform: translate(-5px, 2px); } to { transform: translate(6px, -3px); } }
@keyframes sphereIn { 0% { transform: scale(0); opacity: 0; } 55% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
@keyframes haloIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
@keyframes haloPulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
@keyframes icicle { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
@keyframes drop { from { transform: translateY(-24px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(3px); } }
@keyframes glintIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes glint { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

/* wordmark */
.wordmark {
  margin: 0;
  font-weight: 700;
  font-size: clamp(46px, 12.5vw, 96px);
  letter-spacing: .015em;
  line-height: 1;
  display: flex;
}
.wordmark span {
  display: inline-block;
  background: linear-gradient(180deg, #f3faff 0%, #cfe7fa 38%, #9ccaef 78%, #7db6e6 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  filter: drop-shadow(0 2px 10px rgba(120, 190, 245, .22));
}
.play .wordmark span { animation: letter .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes letter {
  from { opacity: 0; filter: blur(14px); transform: translateY(14px) scale(1.15); }
  to   { opacity: 1; filter: drop-shadow(0 2px 10px rgba(120, 190, 245, .22)); transform: none; }
}
.tagline {
  margin: 8px 0 0;
  font-weight: 600;
  font-size: clamp(12px, 3.1vw, 22px);
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ice-deep);
  text-align: center;
}
.play .tagline { animation: tagIn 1s ease-out 3.75s both; }
@keyframes tagIn { from { opacity: 0; letter-spacing: .4em; } to { opacity: 1; letter-spacing: .06em; } }

.progress { margin-top: 26px; width: min(240px, 70vw); display: grid; gap: 8px; }
.play .progress { animation: upIn .6s ease-out 4.2s both; }
@keyframes upIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.track { height: 3px; border-radius: 3px; background: var(--track); overflow: hidden; }
.fill {
  height: 100%; width: 100%;
  transform-origin: 0 50%; transform: scaleX(var(--p, 1));
  background: linear-gradient(90deg, var(--ice-deep), var(--frost));
  box-shadow: 0 0 10px rgba(170, 215, 250, .7);
  border-radius: 3px;
}
.status {
  display: flex; justify-content: space-between;
  font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.replay {
  position: fixed;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font: 600 12px/1 var(--font-brand); letter-spacing: .1em; text-transform: uppercase;
  color: var(--ice); background: transparent;
  border: 1px solid rgba(169, 212, 245, .3); border-radius: 999px;
  padding: 10px 16px; cursor: pointer;
  transition: background .2s, border-color .2s;
}
.replay:hover { background: rgba(169, 212, 245, .08); border-color: rgba(169, 212, 245, .6); }
.replay:focus-visible { outline: 2px solid var(--frost); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .play * { animation: none !important; } }
</style>

<script>
(() => {
  const stage = document.getElementById('stage');
  const svg = document.getElementById('emblem');
  const canvas = document.getElementById('frost');
  const ctx = canvas.getContext('2d');
  const fill = document.getElementById('fill');
  const pct = document.getElementById('pct');
  const statusText = document.getElementById('statusText');
  const progressEl = document.getElementById('progress');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // outer ring in screen space (viewBox -20 -15 500 500; ring centre 227.5,237.5, mid radius 197.5)
  function ringGeom() {
    const r = svg.getBoundingClientRect();
    const s = r.width / 500;
    return { cx: r.left + (227.5 + 20) * s, cy: r.top + (237.5 + 15) * s, rad: 197.5 * s, s };
  }

  let particles = [], motes = [], t0 = 0, raf = 0, demo = true;
  const ease = t => 1 - Math.pow(1 - t, 3);

  function seed() {
    particles = [];
    for (let i = 0; i < 240; i++) {
      // ring spans -110° → 70° (through left/bottom/right); keep particles on it
      const a = (-110 - Math.random() * 320) * Math.PI / 180;
      particles.push({
        a, spin: 1.1 + Math.random() * 1.6, far: 1.9 + Math.random() * 1.8,
        delay: Math.random() * 0.7, dur: 1.1 + Math.random() * 0.9,
        size: 0.8 + Math.random() * 1.8, jitter: (Math.random() - 0.5) * 22
      });
    }
    motes = [];
  }

  function frame(now) {
    const t = (now - t0) / 1000;
    const g = ringGeom();
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const k = (t - p.delay) / p.dur;
      if (k < 0 || k > 1.15) continue;
      const e = ease(Math.min(k, 1));
      const rad = g.rad * (p.far + (1 - p.far) * e) + p.jitter * g.s;
      const ang = p.a - p.spin * (1 - e);
      const x = g.cx + Math.cos(ang) * rad, y = g.cy + Math.sin(ang) * rad;
      const alpha = k <= 1 ? Math.sin(Math.PI * Math.min(k * 1.1, 1)) * 0.9 + 0.1 : (1.15 - k) / 0.15 * 0.6;
      const sz = p.size * (k > 0.9 ? 1.8 : 1);
      const grd = ctx.createRadialGradient(x, y, 0, x, y, sz * 4);
      grd.addColorStop(0, `rgba(235,247,255,${alpha})`);
      grd.addColorStop(1, 'rgba(120,190,245,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(x, y, sz * 4, 0, Math.PI * 2); ctx.fill();
    }
    if (t > 2.6) {
      if (motes.length < 34 && Math.random() < 0.12) {
        motes.push({
          x: g.cx + (Math.random() - 0.5) * g.rad * 3, y: g.cy + g.rad * (0.5 + Math.random() * 1.2),
          vy: 8 + Math.random() * 16, vx: (Math.random() - 0.5) * 6,
          life: 0, max: 4 + Math.random() * 4, r: 0.6 + Math.random() * 1.2
        });
      }
      for (let i = motes.length - 1; i >= 0; i--) {
        const m = motes[i];
        m.life += 1 / 60; m.y -= m.vy / 60; m.x += m.vx / 60 + Math.sin(m.life * 2) * 0.1;
        if (m.life > m.max) { motes.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(210,236,255,${Math.sin(Math.PI * m.life / m.max) * 0.45})`;
        ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    if (demo) {
      const k = Math.min(Math.max((t - 4.3) / 3.4, 0), 1);
      setProgress(k < 1 ? Math.floor(100 * k * k * (3 - 2 * k)) : 100);
    }
    raf = requestAnimationFrame(frame);
  }

  const steps = [[0, 'Connexion'], [30, 'Lecture des cuves'], [65, 'Chargement des racks'], [100, 'Prêt']];
  function setProgress(v) {
    v = Math.max(0, Math.min(100, Math.round(v)));
    fill.style.setProperty('--p', v / 100);
    pct.textContent = v + ' %';
    progressEl.setAttribute('aria-valuenow', v);
    let label = steps[0][1];
    for (const [th, l] of steps) if (v >= th) label = l;
    statusText.textContent = label;
  }

  function play() {
    stage.classList.remove('play');
    void stage.offsetWidth;
    stage.classList.add('play');
    if (reduce) { setProgress(100); return; }
    setProgress(0);
    seed();
    cancelAnimationFrame(raf);
    t0 = performance.now();
    raf = requestAnimationFrame(frame);
  }

  document.getElementById('replay').addEventListener('click', () => { demo = true; play(); });
  window.CellarLoader = { replay: play, setProgress: v => { demo = false; setProgress(v); } };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(play); else play();
})();
</script>
